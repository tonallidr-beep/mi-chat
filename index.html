<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>WebChat Multisalas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #f4f4f4; }
    #top-bar { background: #2c3e50; color: white; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; gap: 10px; }
    .controls-group { display: flex; align-items: center; gap: 6px; }
    #top-bar input, #top-bar select { padding: 5px 8px; border-radius: 3px; border: none; font-size: 13px; }
    #top-bar button { padding: 5px 10px; background: #3498db; color: white; border: none; border-radius: 3px; cursor: pointer; font-weight: bold; }
    .btn-green { background: #2ecc71 !important; }
    .btn-orange { background: #e67e22 !important; }
    #tabs-bar { background: #e0e0e0; display: flex; border-bottom: 1px solid #ccc; padding: 5px 10px 0; gap: 4px; overflow-x: auto; }
    .tab { padding: 8px 15px; background: #d0d0d0; border-radius: 5px 5px 0 0; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; border: 1px solid #bbb; border-bottom: none; }
    .tab.active { background: #fff; font-weight: bold; color: #0275d8; }
    .close-tab { color: #888; font-weight: bold; cursor: pointer; }
    #main-container { display: flex; flex: 1; overflow: hidden; }
    #chat-area { flex: 1; background: #fff; display: flex; flex-direction: column; }
    .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: none; flex-direction: column; gap: 8px; }
    .messages-box.active { display: flex; }
    .msg { background: #f9f9f9; border: 1px solid #eee; padding: 8px 12px; border-radius: 6px; max-width: 85%; font-size: 14px; }
    .msg-nick { font-weight: bold; margin-right: 6px; }
    .msg-time { font-size: 11px; color: #999; margin-left: 8px; }
    .sys-msg { background: #fff9db; border: 1px solid #ffe066; color: #856404; padding: 6px 12px; border-radius: 4px; font-size: 12px; text-align: center; align-self: center; }
    #users-sidebar { width: 230px; background: #fafafa; border-left: 1px solid #ddd; display: flex; flex-direction: column; }
    #users-header { padding: 10px; background: #eee; font-size: 13px; font-weight: bold; border-bottom: 1px solid #ddd; }
    #users-list { flex: 1; overflow-y: auto; list-style: none; }
    #users-list li { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 8px; height: 8px; background: #2ecc71; border-radius: 50%; }
    #input-bar { display: flex; padding: 10px; background: #eee; border-top: 1px solid #ccc; gap: 8px; }
    #msg-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    #send-btn { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div id="top-bar">
    <div><strong>WebChat</strong> | Apodo: <span id="my-nick">...</span></div>
    <div class="controls-group">
      <select id="room-select"></select>
      <button class="btn-green" onclick="joinSelectedRoom()">Entrar</button>
      <input type="text" id="new-room-input" placeholder="Nueva sala...">
      <button class="btn-orange" onclick="createNewRoom()">+ Crear sala</button>
    </div>
    <div class="controls-group">
      <input type="text" id="new-nick-input" placeholder="Nuevo apodo...">
      <button onclick="changeNick()">Cambiar</button>
    </div>
  </div>
  <div id="tabs-bar"></div>
  <div id="main-container">
    <div id="chat-area"></div>
    <div id="users-sidebar">
      <div id="users-header"><span id="online-count">0</span> en línea</div>
      <ul id="users-list"></ul>
    </div>
  </div>
  <form id="input-bar" onsubmit="sendMessage(event)">
    <input type="text" id="msg-input" placeholder="Escribe tu mensaje aquí..." autocomplete="off">
    <button type="submit" id="send-btn">Enviar</button>
  </form>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myUser = null;
    let activeChat = '#General';
    const chats = {};

    createChatTab('#General', '#General', false, false);
    switchTab('#General');

    function renderRooms(rooms) {
      const s = document.getElementById('room-select');
      s.innerHTML = '';
      rooms.forEach(r => s.innerHTML += `<option value="${r}">${r}</option>`);
    }

    socket.on('init_data', ({ user, rooms }) => {
      myUser = user;
      document.getElementById('my-nick').textContent = user.nick;
      renderRooms(rooms);
    });

    socket.on('update_rooms', renderRooms);

    function openRoom(room) {
      if (!chats[room]) {
        socket.emit('join_room', room);
        createChatTab(room, room, false, true);
      }
      switchTab(room);
    }

    function joinSelectedRoom() { openRoom(document.getElementById('room-select').value); }

    function createNewRoom() {
      const inp = document.getElementById('new-room-input');
      let r = inp.value.trim().replace(/\s+/g, '-').substring(0, 25);
      if (!r) return;
      if (!r.startsWith('#')) r = '#' + r;
      openRoom(r);
      inp.value = '';
    }

    function changeNick() {
      const inp = document.getElementById('new-nick-input');
      if (inp.value.trim()) {
        socket.emit('change_nick', inp.value);
        document.getElementById('my-nick').textContent = inp.value.trim();
        inp.value = '';
      }
    }

    function createChatTab(id, title, isPrivate, closable) {
      if (chats[id]) return;
      chats[id] = { title, isPrivate };
      const tab = document.createElement('div');
      tab.className = 'tab';
      tab.id = `tab-${id}`;
      tab.innerHTML = `<span>${title}</span>` + (closable ? `<span class="close-tab" onclick="closeTab(event, '${id}')">×</span>` : '');
      tab.onclick = () => switchTab(id);
      document.getElementById('tabs-bar').appendChild(tab);

      const box = document.createElement('div');
      box.className = 'messages-box';
      box.id = `box-${id}`;
      document.getElementById('chat-area').appendChild(box);
    }

    function switchTab(id) {
      activeChat = id;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.messages-box').forEach(b => b.classList.remove('active'));
      const tab = document.getElementById(`tab-${id}`);
      const box = document.getElementById(`box-${id}`);
      if (tab && box) {
        tab.classList.add('active');
        tab.style.background = '';
        box.classList.add('active');
        box.scrollTop = box.scrollHeight;
      }
    }

    function closeTab(e, id) {
      e.stopPropagation();
      if (!chats[id].isPrivate) socket.emit('leave_room', id);
      delete chats[id];
      document.getElementById(`tab-${id}`).remove();
      document.getElementById(`box-${id}`).remove();
      if (activeChat === id) switchTab('#General');
    }

    function sendMessage(e) {
      e.preventDefault();
      const inp = document.getElementById('msg-input');
      if (!inp.value.trim()) return;
      socket.emit('send_message', { target: activeChat, text: inp.value, isPrivate: chats[activeChat].isPrivate });
      inp.value = '';
    }

    socket.on('receive_message', (d) => {
      if (d.isPrivate && !chats[d.chatId]) createChatTab(d.chatId, d.chatName || 'Privado', true, true);
      const box = document.getElementById(`box-${d.chatId}`);
      if (!box) return;
      box.innerHTML += `<div class="msg"><span class="msg-nick" style="color:${d.senderColor}">${d.senderNick}:</span>${d.text}<span class="msg-time">${d.time}</span></div>`;
      box.scrollTop = box.scrollHeight;
      if (activeChat !== d.chatId && document.getElementById(`tab-${d.chatId}`)) {
        document.getElementById(`tab-${d.chatId}`).style.background = '#ffeeba';
      }
    });

    socket.on('system_msg', ({ target, text }) => {
      const box = document.getElementById(`box-${target}`);
      if (box) { box.innerHTML += `<div class="sys-msg">${text}</div>`; box.scrollTop = box.scrollHeight; }
    });

    socket.on('update_users', (list) => {
      document.getElementById('online-count').textContent = list.length;
      const ul = document.getElementById('users-list');
      ul.innerHTML = '';
      list.forEach(u => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="status-dot"></span> <span style="color:${u.color}; font-weight:bold;">${u.nick}</span>`;
        if (myUser && u.id !== myUser.id) li.onclick = () => { createChatTab(u.id, u.nick, true, true); switchTab(u.id); };
        ul.appendChild(li);
      });
    });
  </script>
</body>
</html>
